{% extends 'travello/base.html' %}

{% block title %}
Eliminar Destino
{% endblock %}

{% block content %}

<div class="formulario">

    <h2>Eliminar Destino</h2>

    <p>
        ¿Desea eliminar el destino
        <strong>{{ destino.nombreCiudad }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

</div>

{% endblock %}
