<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Destino</title>
</head>
<body>

<h1>Eliminar Destino</h1>

<p>
    ¿Está seguro de eliminar el destino
    <strong>{{ destino.nombreCiudad }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

</form>

<br>

<a href="{% url 'listar_destinos' %}">
    Cancelar
</a>

</body>
</html>
